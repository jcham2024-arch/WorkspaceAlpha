name: Wiki CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"  # Weekly, Sundays at 02:00 UTC

jobs:
  wiki-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run wiki generator in check mode
        run: |
          python3 wiki/views/generator.py delegation-test-001 --output-dir /tmp/wiki-check
          echo "Wiki generation successful"

  wiki-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate wiki
        run: python3 wiki/views/generator.py delegation-ci-001 --output-dir wiki/

      - name: Commit wiki changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add wiki/
          git diff --quiet || git commit -m "wiki: regenerate wiki views for ${{ github.sha }}"
          git push
